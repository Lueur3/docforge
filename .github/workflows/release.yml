name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build executable and Inno Setup installer
        run: |
          python build_exe.py

      - name: Create portable archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          Compress-Archive -Path "dist/DocForge/*" -DestinationPath "dist/DocForge-Portable-$tag.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-Release
          path: |
            dist/DocForge-Setup-*.exe
            dist/DocForge-Portable-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "DocForge ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/DocForge-Setup-*.exe
            dist/DocForge-Portable-*.zip
